[project]
name = "tandem-tvs-backend"
version = "0.1.0"
description = "Stage 1 backend for the Tandem portal module"
requires-python = ">=3.13,<3.14"
dependencies = [
  "celery[redis]>=5.5,<6",
  "channels==4.3.2",
  "channels-redis==4.3.0",
  "django==5.2.17",
  "django-redis>=6,<7",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.29",
  "drf-spectacular-sidecar==2026.8.1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<8",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "basedpyright>=1.31,<2",
  "daphne>=4.2,<5",
  "django-stubs>=5.2,<6",
  "djangorestframework-stubs>=3.16,<4",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-django>=4.11,<5",
  "pip-audit==2.10.1",
  "ruff>=0.12,<1",
  "ty>=0.0.1a20,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=93"

[tool.coverage.run]
omit = ["*/migrations/*", "*/management/commands/*", "config/wsgi.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["apps", "config", "tests"]
exclude = ["**/migrations"]
