name: tandem-tvs

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: tandem-tvs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tandem}
      POSTGRES_USER: ${POSTGRES_USER:-tandem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.0-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["uv", "run", "--no-sync", "python", "manage.py", "migrate", "--noinput"]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-tandem}
      POSTGRES_USER: ${POSTGRES_USER:-tandem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem-development-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AUTH_MODE: LOCAL_ONLY
      PORTAL_ADAPTER: ${PORTAL_ADAPTER:-mock}
      ALLOW_BOOTSTRAP_LOCAL_ADMIN: "false"
      STAGE6_DEMO_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,tandem-tvs.chatlink.kz}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1:8080,https://tandem-tvs.chatlink.kz}
      TANDEM_ENVIRONMENT_PURPOSE: ${TANDEM_ENVIRONMENT_PURPOSE:-}
      POSTGRES_DB: ${POSTGRES_DB:-tandem}
      POSTGRES_USER: ${POSTGRES_USER:-tandem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem-development-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REALTIME_REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AUTH_MODE: LOCAL_ONLY
      AUTH_RECOVERY_MODE: ${AUTH_RECOVERY_MODE:-ADMIN_ONLY}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:8080}
      ALLOW_BOOTSTRAP_LOCAL_ADMIN: ${ALLOW_BOOTSTRAP_LOCAL_ADMIN:-true}
      STAGE6_DEMO_PASSWORD: ${STAGE6_DEMO_PASSWORD:-Tandem development passphrase 2026}
      MEDIA_ROOT: /app/media
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1:8080,https://tandem-tvs.chatlink.kz}
      PORTAL_ADAPTER: ${PORTAL_ADAPTER:-mock}
      MOCK_PORTAL_USER_ID: ${MOCK_PORTAL_USER_ID:-employee-1}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_ALLOWED_HOST_SUFFIXES: ${WEB_PUSH_ALLOWED_HOST_SUFFIXES:-fcm.googleapis.com,updates.push.services.mozilla.com,notify.windows.com,web.push.apple.com}
      WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER: ${WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER:-5}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:security@example.invalid}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_INACTIVE_AFTER_HOURS: ${NOTIFICATION_EMAIL_INACTIVE_AFTER_HOURS:-24}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-tandem@example.invalid}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import os,urllib.request; host=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0]; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    read_only: true
    volumes:
      - media-data:/app/media
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - default
      - backend-proxy
    restart: unless-stopped

  celery-worker:
    build: ./backend
    entrypoint: ["uv", "run", "--no-sync", "celery"]
    command: ["-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,tandem-tvs.chatlink.kz}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1:8080,https://tandem-tvs.chatlink.kz}
      POSTGRES_DB: ${POSTGRES_DB:-tandem}
      POSTGRES_USER: ${POSTGRES_USER:-tandem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem-development-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REALTIME_REDIS_URL: redis://redis:6379/1
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1:8080,https://tandem-tvs.chatlink.kz}
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AUTH_MODE: LOCAL_ONLY
      AUTH_RECOVERY_MODE: ${AUTH_RECOVERY_MODE:-ADMIN_ONLY}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:8080}
      ALLOW_BOOTSTRAP_LOCAL_ADMIN: "false"
      MEDIA_ROOT: /app/media
      PORTAL_ADAPTER: ${PORTAL_ADAPTER:-mock}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_ALLOWED_HOST_SUFFIXES: ${WEB_PUSH_ALLOWED_HOST_SUFFIXES:-fcm.googleapis.com,updates.push.services.mozilla.com,notify.windows.com,web.push.apple.com}
      WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER: ${WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER:-5}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:security@example.invalid}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_INACTIVE_AFTER_HOURS: ${NOTIFICATION_EMAIL_INACTIVE_AFTER_HOURS:-24}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-tandem@example.invalid}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media-data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 10s
      timeout: 7s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  celery-beat:
    build: ./backend
    entrypoint: ["uv", "run", "--no-sync", "celery"]
    command:
      ["-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,tandem-tvs.chatlink.kz}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1:8080,https://tandem-tvs.chatlink.kz}
      POSTGRES_DB: ${POSTGRES_DB:-tandem}
      POSTGRES_USER: ${POSTGRES_USER:-tandem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem-development-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REALTIME_REDIS_URL: redis://redis:6379/1
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1:8080,https://tandem-tvs.chatlink.kz}
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AUTH_MODE: LOCAL_ONLY
      AUTH_RECOVERY_MODE: ${AUTH_RECOVERY_MODE:-ADMIN_ONLY}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-http://localhost:8080}
      ALLOW_BOOTSTRAP_LOCAL_ADMIN: "false"
      MEDIA_ROOT: /app/media
      PORTAL_ADAPTER: ${PORTAL_ADAPTER:-mock}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_ALLOWED_HOST_SUFFIXES: ${WEB_PUSH_ALLOWED_HOST_SUFFIXES:-fcm.googleapis.com,updates.push.services.mozilla.com,notify.windows.com,web.push.apple.com}
      WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER: ${WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER:-5}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:security@example.invalid}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_INACTIVE_AFTER_HOURS: ${NOTIFICATION_EMAIL_INACTIVE_AFTER_HOURS:-24}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-tandem@example.invalid}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media-data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync python -c \"import os,time; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.development'); import django; django.setup(); from django.core.cache import cache; heartbeat=cache.get('tandem:celery:reconcile-heartbeat'); assert heartbeat and time.time()-heartbeat < 60\""]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    volumes:
      - media-data:/srv/media:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /tmp:uid=101,gid=101,mode=0700
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - backend-proxy
      - tunnel-edge
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      frontend:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - tunnel-edge
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:

networks:
  backend-proxy:
    ipam:
      config:
        - subnet: 172.31.251.0/29
  tunnel-edge:
    ipam:
      config:
        - subnet: 172.31.250.0/29
